<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1.5s ease;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .weather-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .location i {
            font-size: 1.5rem;
            color: #ffcc00;
        }

        .location h2 {
            font-size: 1.8rem;
        }

        .weather-icon {
            font-size: 6rem;
            margin: 10px 0;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.3));
        }

        .temperature {
            font-size: 4rem;
            font-weight: bold;
            margin: 10px 0;
            display: flex;
            align-items: flex-start;
        }

        .unit-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .unit-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .detail {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .detail i {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .detail-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .description {
            font-size: 1.5rem;
            margin: 10px 0;
            text-transform: capitalize;
        }

        .loading {
            font-size: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #ff6b6b;
            font-size: 1.2rem;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .temperature {
                font-size: 3rem;
            }
            
            .weather-icon {
                font-size: 5rem;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
            }
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Weather</h1>
        <div class="weather-card">
            <div class="location">
                <i class="fas fa-map-marker-alt"></i>
                <h2 id="location">Detecting your location...</h2>
            </div>
            
            <div id="weather-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading weather data...</p>
                </div>
            </div>
            
            <button class="unit-toggle" id="unit-toggle">Switch to °F</button>
        </div>
        <footer>
            <p>Weather data provided by freeCodeCamp Weather API</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const locationElement = document.getElementById('location');
        const weatherContent = document.getElementById('weather-content');
        const unitToggle = document.getElementById('unit-toggle');
        
        // App state
        let currentWeather = null;
        let isCelsius = true;
        
        // Weather icons mapping
        const weatherIcons = {
            'clear': 'fas fa-sun',
            'clouds': 'fas fa-cloud',
            'rain': 'fas fa-cloud-rain',
            'drizzle': 'fas fa-cloud-drizzle',
            'thunderstorm': 'fas fa-bolt',
            'snow': 'fas fa-snowflake',
            'mist': 'fas fa-smog',
            'smoke': 'fas fa-smog',
            'haze': 'fas fa-smog',
            'dust': 'fas fa-smog',
            'fog': 'fas fa-smog',
            'sand': 'fas fa-smog',
            'ash': 'fas fa-smog',
            'squall': 'fas fa-wind',
            'tornado': 'fas fa-tornado'
        };
        
        // Background gradients based on weather conditions
        const weatherBackgrounds = {
            'clear': ['#ff7e5f', '#feb47b'],
            'clouds': ['#757F9A', '#D7DDE8'],
            'rain': ['#3a7bd5', '#00d2ff'],
            'drizzle': ['#3a7bd5', '#00d2ff'],
            'thunderstorm': ['#0F2027', '#203A43', '#2C5364'],
            'snow': ['#8e9eab', '#eef2f3'],
            'default': ['#1a2a6c', '#b21f1f', '#fdbb2d']
        };
        
        // Get user's location
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const { latitude, longitude } = position.coords;
                        getWeatherData(latitude, longitude);
                    },
                    error => {
                        showError("Unable to retrieve your location. Using default location.");
                        // Default to New York coordinates
                        getWeatherData(40.7128, -74.0060);
                    }
                );
            } else {
                showError("Geolocation is not supported by this browser.");
                // Default to New York coordinates
                getWeatherData(40.7128, -74.0060);
            }
        }
        
        // Fetch weather data from API
        async function getWeatherData(lat, lon) {
            try {
                const response = await fetch(`https://weather-proxy.freecodecamp.rocks/api/current?lat=${lat}&lon=${lon}`);
                const data = await response.json();
                
                if (data && data.main) {
                    currentWeather = data;
                    displayWeather(data);
                } else {
                    throw new Error("Invalid weather data received");
                }
            } catch (error) {
                console.error("Error fetching weather data:", error);
                showError("Failed to load weather data. Please try again later.");
            }
        }
        
        // Display weather data
        function displayWeather(data) {
            const { name, sys, weather, main, wind } = data;
            const weatherCondition = weather[0].main.toLowerCase();
            
            // Update location
            locationElement.textContent = `${name}, ${sys.country}`;
            
            // Update background based on weather
            updateBackground(weatherCondition);
            
            // Create weather content HTML
            const weatherHTML = `
                <div class="weather-icon">
                    <i class="${getWeatherIcon(weatherCondition)}"></i>
                </div>
                <div class="temperature" id="temperature">
                    ${Math.round(main.temp)}°C
                </div>
                <div class="description">${weather[0].description}</div>
                <div class="weather-details">
                    <div class="detail">
                        <i class="fas fa-temperature-high"></i>
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value" id="feels-like">${Math.round(main.feels_like)}°C</div>
                    </div>
                    <div class="detail">
                        <i class="fas fa-tint"></i>
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${main.humidity}%</div>
                    </div>
                    <div class="detail">
                        <i class="fas fa-wind"></i>
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value">${wind.speed} m/s</div>
                    </div>
                    <div class="detail">
                        <i class="fas fa-compress-arrows-alt"></i>
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value">${main.pressure} hPa</div>
                    </div>
                </div>
            `;
            
            weatherContent.innerHTML = weatherHTML;
        }
        
        // Get appropriate weather icon
        function getWeatherIcon(condition) {
            return weatherIcons[condition] || weatherIcons['clear'];
        }
        
        // Update background based on weather condition
        function updateBackground(condition) {
            const body = document.body;
            const backgrounds = weatherBackgrounds[condition] || weatherBackgrounds['default'];
            
            if (backgrounds.length === 2) {
                body.style.background = `linear-gradient(135deg, ${backgrounds[0]}, ${backgrounds[1]})`;
            } else if (backgrounds.length === 3) {
                body.style.background = `linear-gradient(135deg, ${backgrounds[0]}, ${backgrounds[1]}, ${backgrounds[2]})`;
            }
        }
        
        // Convert temperature between Celsius and Fahrenheit
        function convertTemperature() {
            if (!currentWeather) return;
            
            const tempElement = document.getElementById('temperature');
            const feelsLikeElement = document.getElementById('feels-like');
            
            if (isCelsius) {
                // Convert to Fahrenheit
                const tempF = Math.round((currentWeather.main.temp * 9/5) + 32);
                const feelsLikeF = Math.round((currentWeather.main.feels_like * 9/5) + 32);
                
                tempElement.textContent = `${tempF}°F`;
                feelsLikeElement.textContent = `${feelsLikeF}°F`;
                unitToggle.textContent = 'Switch to °C';
            } else {
                // Convert to Celsius
                const tempC = Math.round(currentWeather.main.temp);
                const feelsLikeC = Math.round(currentWeather.main.feels_like);
                
                tempElement.textContent = `${tempC}°C`;
                feelsLikeElement.textContent = `${feelsLikeC}°C`;
                unitToggle.textContent = 'Switch to °F';
            }
            
            isCelsius = !isCelsius;
        }
        
        // Show error message
        function showError(message) {
            weatherContent.innerHTML = `
                <div class="error">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${message}</p>
                </div>
            `;
        }
        
        // Event listeners
        unitToggle.addEventListener('click', convertTemperature);
        
        // Initialize app
        getLocation();
    </script>
</body>
</html>
